<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>連絡帳に書き込む</title>
<!-- 古いURL（form.html）を開いた人を、現在のページ（register.html）へ自動で案内する転送ページ。
     LINEのリッチメニューなど、form.htmlを指している古いリンクがあっても、常に最新の画面が開く。
     ?from=line や #radar などのURLの後ろの部分も、そのまま引き継ぐ。
     ※このファイルには画面の中身を持たせない（中身は register.html だけを更新すればよい）。 -->
<meta http-equiv="refresh" content="1;url=register.html">
<script>
  (function(){
    var target = 'register.html' + (location.search || '') + (location.hash || '');
    location.replace(target);
  })();
</script>
</head>
<body style="font-family:sans-serif;background:#faf8f4;color:#2d2620;text-align:center;padding:48px 16px">
  <p style="font-size:14px">移動しています…</p>
  <p style="font-size:13px;margin-top:12px"><a href="register.html" style="color:#813100">自動で移動しない場合は、こちらをタップしてください</a></p>
</body>
</html>
